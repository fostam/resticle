# secrets.example.yaml — template for resticle's secrets file.
#
# Copy to secrets.yaml, replace every value, then encrypt it with SOPS:
#
#   cp secrets.example.yaml secrets.yaml
#   $EDITOR secrets.yaml                       # put the real values in
#   age-keygen -o ~/.config/sops/age/keys.txt  # once, if you have no key yet
#   sops -e -i --age <age1-public-key> secrets.yaml
#   chmod 600 secrets.yaml                     # sops -i leaves it 0644
#
# Edit it later with `sops secrets.yaml` — never decrypt it to disk.
# Encrypted, this file is safe to commit next to config.yaml; unencrypted it
# is not, which is what .githooks/pre-commit checks.
#
# resticle finds it as secrets.yaml next to the config file, or wherever
# --secrets points. An unencrypted secrets.yaml also works (chmod 600) —
# resticle refuses any secret file that is group- or world-readable.
#
# Top-level keys are each job's `secrets:` value, which defaults to the job
# name. Per job:
#   password:  the restic repository password    (required)
#   env:       backend credentials as env vars   (only for remote backends)
# Both reach restic through the environment, never the command line.

local-usb:
  password: CHANGE-ME-local-usb-repository-password

backblaze:
  password: CHANGE-ME-backblaze-repository-password
  env:
    B2_ACCOUNT_ID: CHANGE-ME-b2-application-key-id
    B2_ACCOUNT_KEY: CHANGE-ME-b2-application-key

nas:
  password: CHANGE-ME-nas-repository-password

offsite:
  password: CHANGE-ME-offsite-repository-password
